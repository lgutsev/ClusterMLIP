[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cluster-mlip-pipeline"
version = "0.3.1"
description = "Analyze Gaussian cluster archives and prepare charge/spin-aware MACE datasets"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
cluster-mlip = "cluster_mlip.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
