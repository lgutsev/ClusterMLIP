[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cluster-mlip-pipeline"
version = "0.8.0"
description = "Analyze Gaussian cluster archives and prepare charge/spin-aware MACE datasets"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Needed only for `configs/train_from_scratch.sh` / `configs/finetune_foundation.sh`
# and for `cluster-mlip select-next-batch` (committee inference).
train = ["mace-torch>=0.3.16"]
dev = ["mypy>=1.8"]

[project.scripts]
cluster-mlip = "cluster_mlip.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
